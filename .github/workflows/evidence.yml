name: evidence

# Re-derives the committed JSON from the published raw logs. The audit workflow
# proves the derived files and the documents agree with each other; this proves
# they came from the logs. Separate because it downloads 259 MiB and unpacks
# 4 GB, which has no business running on every push.
#
# Run it from the Actions tab, or let the weekly schedule catch a drift between
# the extractors and the dumps they produced.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: the release holding raw_logs.tar.zst
        default: raw-evidence-2026-08-27
        required: false
  release:
    types: [published]
  schedule:
    - cron: "37 5 * * 1"
  # `schedule` and `workflow_dispatch` only fire from the DEFAULT branch, so on
  # a branch this workflow could not run at all and its evidence chain was
  # never demonstrated - only asserted. `push` reads the workflow from the ref
  # being pushed, so this makes it runnable here. Scoped to the files that
  # decide what the extraction does, which is when the chain needs re-proving.
  push:
    paths:
      - analysis/rederive_from_logs.py
      - analysis/extract_checkpoint_timers.py
      - analysis/extract_spec_accounting.py
      - analysis/compare_acceptance_counters.py
      # the last step of this job runs the claim checker, so a change to it can
      # break this workflow without touching an extractor - which is how the
      # shallow-clone failure reached a green audit and a red evidence run
      - analysis/verify_claims.py
      - .github/workflows/evidence.yml
      - v4_audit_2026_08_25/EVIDENCE_MANIFEST.sha256

permissions:
  contents: read

# See the same block in audit.yml: the default `bash -e {0}` has no pipefail,
# so a piped checker can print a failure into a green job. Every step here
# already sets `-euo pipefail` itself; this makes it the default so a step
# added later does not have to remember.
defaults:
  run:
    shell: bash

jobs:
  rederive:
    name: raw logs to committed JSON
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # full history, for the same reason audit.yml gives: the last step here
        # runs the claim checker, whose provenance assertions resolve run
        # manifests against every version of the runner this repository has
        # held. The first real run of this workflow failed on exactly that.
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: fetch the archive
        env:
          GH_TOKEN: ${{ github.token }}
          # `github.event.inputs` does not exist on a release event, so this
          # used to fall through to the hard-coded tag and validate LAST
          # release's archive against a new release. Route on the event.
          TAG: >-
            ${{
              github.event_name == 'release'
                && github.event.release.tag_name
                || (inputs.release_tag || 'raw-evidence-2026-08-27')
            }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
             --pattern '*.tar.zst' --dir evidence
          ls -l evidence

      - name: the archive is the one the repository names
        run: |
          set -euo pipefail
          check() {
            local file="$1" want="$2"
            [ -f "$file" ] || { echo "missing $file" >&2; return 1; }
            local got; got=$(sha256sum "$file" | cut -d' ' -f1)
            echo "$(basename "$file") want $want got $got"
            [ "$want" = "$got" ]
            # and the same digest is what the manifest and the audit README record
            grep -q "$want" v4_audit_2026_08_25/EVIDENCE_MANIFEST.sha256
            grep -q "$want" v4_audit_2026_08_25/README.md
          }
          check evidence/raw_logs.tar.zst \
            29c2401f100390268bbd52e43b5c2da9a61440bad3dabe502ca1684478771fd6
          check evidence/raw_logs_20260827.tar.zst \
            d56a7f88a099550bdab229ccb2bd36840f167550cea7689f575fd6d0f11da8ff
          check evidence/raw_logs_20260828.tar.zst \
            5af671bf3cf47a20fa2ca78504c089642b9bb2ea249b8997577b4852caa7a5c2
          # the telemetry archives were recorded in the manifest and never
          # verified here, so a trace could have been replaced without the
          # digest check noticing; only the per-file sums would have caught it
          check evidence/telemetry.tar.zst \
            8a29cc875e30bc66c6e83913b1bf40b075295218a37eef37897317805b47d03c
          check evidence/telemetry_20260827.tar.zst \
            db833395470aeaf842225a33fb544e933f1c0a3047cac161524aca1ac1aef061
          check evidence/telemetry_20260828.tar.zst \
            72e331bf0cbfaaee73619acf320523598cab4a46b7a7daa51fabbd6e2c455bf3

      - name: unpack, and check every file against the manifest
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y zstd
          mkdir -p bench
          # two tranches: the first archive keeps the digest it was published
          # with, the second carries the 2026-08-27 runs
          tar --use-compress-program=unzstd -xf evidence/raw_logs.tar.zst -C bench
          if [ -f evidence/raw_logs_20260827.tar.zst ]; then
            tar --use-compress-program=unzstd -xf evidence/raw_logs_20260827.tar.zst -C bench
          fi
          if [ -f evidence/telemetry.tar.zst ]; then
            tar --use-compress-program=unzstd -xf evidence/telemetry.tar.zst -C bench \
                --strip-components=1
          fi
          if [ -f evidence/telemetry_20260827.tar.zst ]; then
            tar --use-compress-program=unzstd -xf evidence/telemetry_20260827.tar.zst -C bench
          fi
          # third tranche: run W's 500 logs and its telemetry trace
          if [ -f evidence/raw_logs_20260828.tar.zst ]; then
            tar --use-compress-program=unzstd -xf evidence/raw_logs_20260828.tar.zst -C bench
          fi
          if [ -f evidence/telemetry_20260828.tar.zst ]; then
            tar --use-compress-program=unzstd -xf evidence/telemetry_20260828.tar.zst -C bench
          fi
          grep -v '^#' v4_audit_2026_08_25/EVIDENCE_MANIFEST.sha256 | grep -v '^$' > /tmp/manifest
          cd bench && sha256sum -c /tmp/manifest
          echo "$(find . -name '*.log' | wc -l) logs verified"

      - name: put the committed arm-run JSON beside the logs
        run: |
          set -euo pipefail
          # four runs are archived under their bench-host names
          declare -A as=(
            [C_master_matrix_think_on]=matrix_C_20260825_204529
            [D_master_matrix_think_off]=matrix_D_20260825_204529
            [E_past_threshold]=matrix_E_threshold_20260825_224802
            [H_pmin_sweep]=matrix_H_pmin_20260826_005716
          )
          # `|| true` hid a failed copy, so the re-derivation could run against
          # a directory that never received the committed JSON and report a gap
          # as though the extractor had produced one.
          staged=0
          for d in v4_audit_2026_08_25/data/*/; do
            n=$(basename "$d")
            t="bench/${as[$n]:-$n}"
            [ -d "$t" ] || continue
            found=0
            for f in "$d"*.json; do
              [ -e "$f" ] || continue
              cp "$f" "$t"/ || { echo "FAIL: cannot stage $f" >&2; exit 1; }
              found=1
            done
            [ "$found" -eq 1 ] || { echo "FAIL: no JSON to stage from $d" >&2; exit 1; }
            staged=$((staged + 1))
          done
          echo "staged JSON into $staged run directories"
          [ "$staged" -gt 0 ] || { echo "FAIL: staged nothing" >&2; exit 1; }

      - name: re-derive, and require the result to be what is committed
        env:
          # the whole point of this job is that the archive regenerates the
          # committed JSON; a missing run T4 must fail it, not be reported
          REDERIVE_REQUIRE_T4: "1"
        run: python analysis/rederive_from_logs.py bench

      - name: every quoted figure still matches the re-derived data
        run: python analysis/verify_claims.py
