# The two linters the static job runs, pinned by hash for the reason the
# charts job gives about its own lock: a job that checks this repository must
# not be able to change without a change in this repository.
#
# `shellcheck` used to come from `apt-get install -y shellcheck`, which is
# whatever Ubuntu ships that week. A shellcheck release that adds a check
# turns the build red with nothing here having moved, and one that drops a
# check turns it green the same way. `shellcheck-py` carries the upstream
# binary; 0.10.0.1 wraps shellcheck 0.10.0.
#
# Regenerate with:
#   pip download --no-deps --only-binary=:all: <pkg>==<ver> && pip hash <file>
# and keep both the linux wheel and the pure-python one: the first is what CI
# resolves, the second is what a macOS checkout resolves, and `--require-hashes`
# refuses an installation whose file is not listed.

