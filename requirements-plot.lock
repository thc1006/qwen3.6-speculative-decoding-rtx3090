# Hash-pinned dependencies for `analysis/plot_v4_runs.py`, used by the `charts`
# CI job. `requirements.txt` gives ranges, which means the job that checks the
# charts against the data could itself change without anyone changing this
# repository. These are the exact artefacts that produced the committed charts.
#
# The wheels are cp313/manylinux_x86_64, so the charts job pins Python 3.13 on
# ubuntu-latest. Regenerate with:
#   python -m venv .v && .v/bin/pip install 'matplotlib>=3.10,<4' 'numpy>=2.0,<3'
#   .v/bin/pip download -d wheels matplotlib numpy
#   for w in wheels/*; do .v/bin/pip hash "$w"; done
